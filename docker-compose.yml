services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Bound to 127.0.0.1: reachable from this machine (local scripts, eval)
    # but never from the network -- Qdrant has no auth, anyone reaching it
    # could read or delete the index. The api container uses the internal
    # network (http://qdrant:6333) and doesn't need these at all.
    ports:
      - "127.0.0.1:6333:6333" # HTTP / REST API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    ulimits:
      # RocksDB opens a lot of file handles per collection/segment; the
      # container's default (1024) runs out partway through recreating
      # several collections in a row and fails with "Too many open files".
      nofile:
        soft: 65536
        hard: 65536

  # FastAPI over the Librarian (src/api/main.py). On first start the
  # entrypoint fetches the corpus and builds the index if it's missing.
  api:
    build: .
    image: owasp-librarian:latest
    env_file: .env # secrets live only here, never in the image
    environment:
      QDRANT_URL: http://qdrant:6333 # overrides .env's localhost value inside the network
      ENSURE_INDEX: "1"
    depends_on:
      - qdrant
    # Localhost only: /ask spends the OpenAI key, so on a server the public
    # entry point is the UI alone. The ui container calls http://api:8000.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - index_data:/app/data/index
      - embedding_cache:/app/data/cache
      - corpus_data:/app/corpus
      - ./data/logs:/app/data/logs # requests.jsonl / feedback.jsonl, readable on the host
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 600s # first start builds the index
    restart: unless-stopped

  # Streamlit UI (src/ui/app.py): talks to the API over HTTP, holds no keys.
  ui:
    build: . # same Dockerfile and tag as api; the second build is all cache hits
    image: owasp-librarian:latest
    command: ["streamlit", "run", "src/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  qdrant_data:
  index_data:
  embedding_cache:
  corpus_data:
